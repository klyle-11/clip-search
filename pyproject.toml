[project]
name = "clipsearch"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = ["yt-dlp", "numpy", "python-dotenv"]

[project.optional-dependencies]
semantic = ["sentence-transformers"]
whisper = ["faster-whisper", "feedparser", "requests"]
diarize = ["pyannote.audio>=3.1"]

[project.scripts]
clipsearch = "clipsearch.cli:main"

[tool.setuptools]
packages = ["clipsearch"]

[tool.setuptools.package-data]
clipsearch = ["*.html"]
